# @package _global_
# Shared by the toy smoke and the full-model AudioMCQ run.
hydra:
  searchpath:
    - pkg://verl.trainer.config
    - pkg://verl_omni.trainer.config

defaults:
  - ppo_megatron_trainer
  - omni/model@actor_rollout_ref.model: omni_model
  - _self_

data:
  train_files: ???
  val_files: ???
  custom_cls:
    path: pkg://verl_omni.utils.dataset.omni_rl_datasets
    name: QwenOmniRLHFDataset
  mm_processor_kwargs:
    sampling_rate: 16000
  train_batch_size: 16
  max_prompt_length: 768
  max_response_length: 256
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ???
    # Registered Omni input adapter over verl's Megatron LM engine.
    model_type: omni_model
    model_stage: thinker
    lora_rank: 0
    lora:
      rank: 0
    use_remove_padding: false
    enable_gradient_checkpointing: true
  actor:
    strategy: megatron
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 4096
    use_kl_loss: false
    policy_loss:
      loss_mode: gspo
    loss_agg_mode: seq-mean-token-mean
    clip_ratio_low: 0.0003
    clip_ratio_high: 0.0004
    clip_ratio_c: 10.0
    optim:
      lr: 1.0e-6
      clip_grad: 1.0
      weight_decay: 0.1
    megatron:
      use_mbridge: true
      vanilla_mbridge: false
      use_remove_padding: false
      tensor_model_parallel_size: 4
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: 1
      sequence_parallel: true
      param_offload: true
      optimizer_offload: true
      grad_offload: true
      override_transformer_config:
        freeze_language_model: false
        freeze_vision_model: true
        freeze_audio_model: true
        attention_backend: flash
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1
  ref:
    strategy: megatron
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    name: vllm_omni
    mode: async
    n: 8
    temperature: 1.0
    nnodes: 4
    n_gpus_per_node: 4
    tensor_model_parallel_size: 4
    data_parallel_size: 1
    pipeline_model_parallel_size: 1
    load_format: safetensors
    max_model_len: 1024
    max_num_seqs: 32
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.6
    enable_prefix_caching: false
    calculate_log_probs: true
    logprobs_mode: raw_logprobs
    log_prob_use_dynamic_bsz: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 4096
    checkpoint_engine:
      backend: nccl
      update_weights_bucket_megabytes: 256
    engine_kwargs:
      vllm_omni:
        output_mode: ar
        pipeline_name: qwen3_omni_moe
        pipeline_mode: thinker_only
        # AudioMCQ-specific limits, not a restriction on the shared AR strategy.
        limit_mm_per_prompt:
          audio: 1
          image: 0
          video: 0
    val_kwargs:
      n: 1
      do_sample: false

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  rollout_correction:
    # Exercise V1 old-policy recomputation and parameter save/restore.
    bypass_mode: false

reward:
  reward_manager:
    source: register
    name: naive
  custom_reward_function:
    path: pkg://verl_omni.utils.reward_score.audio_mcq
    name: compute_score

ray_kwargs:
  ray_init:
    address: null
    runtime_env:
      # A pre-started cluster does not inherit the driver's new exports.
      env_vars:
        VERL_USE_EXTERNAL_MODULES: verl_omni
        TENSORBOARD_DIR: ${oc.env:TENSORBOARD_DIR,${trainer.default_local_dir}/tensorboard}
        CUDA_DEVICE_MAX_CONNECTIONS: ${oc.env:CUDA_DEVICE_MAX_CONNECTIONS,1}
        RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
        PYTHONUNBUFFERED: "1"

trainer:
  v1:
    trainer_mode: omni_separate_async
    separate_async:
      num_warmup_batches: 1
      # train_batch_size == parameter_sync_step * ppo_mini_batch_size.
      parameter_sync_step: 1
      hybrid_rollout:
        enable_switch: false
  nnodes: 4
  n_gpus_per_node: 4
  total_training_steps: 150
  val_before_train: true
  test_freq: 10
  save_freq: -1
  resume_mode: disable
  logger: [console, tensorboard]
  project_name: qwen3_omni_audiomcq
  experiment_name: megatron_separate_async
